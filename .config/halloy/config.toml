[servers.irctoday]
nickname = "bkhl"
server = "irctoday.com"
port = 6697
use_tls = true

[servers.irctoday.sasl.plain]
username = "bkhl"
password_file = "irctoday.secret"

[buffer]
line_spacing = 8

[buffer.nickname]
alignment = "right"
truncate = 10
hide_consecutive.enabled = { smart = 180 }

[buffer.chathistory]
infinite_scroll = true

[theme]
light = "Macaw Light"
dark = "Macaw Dark"

[font]
family = "Inter BKHL Variable"
size = 18

[keyboard]
cycle_next_buffer = "alt+down"
cycle_previous_buffer = "alt+up"
cycle_next_unread_buffer = "alt+shift+down"
cycle_previous_unread_buffer = "alt+shift+up"
focus_down = "ctrl+alt+shift+down"
focus_up = "ctrl+alt+shift+up"

[actions.sidebar]
buffer = "replace-pane"

[actions.buffer]
click_channel_name = "replace-pane"
click_highlight = "replace-pane"
click_nickname = { "open-query" = "replace-pane" }
join_channel = "replace-pane"
open_internal = "replace-pane"
message_channel = "replace-pane"
message_user = "replace-pane"

[buffer.server_messages.condense]
messages = ["change-nick", "join", "part", "quit"]
format = "brief"

[buffer.server_messages.join]
smart = 900

[buffer.server_messages.part]
smart = 900

[buffer.server_messages.quit]
smart = 900

[buffer.server_messages.change_nick]
smart = 900

[preview]
enabled = false
